name: Перевірка наборів даних

on:
  workflow_dispatch:
    inputs:
      q:
        description: Запит до каталогу (кілька через |)
        required: false
      url:
        description: Адреса файлу (кілька через |)
        required: false
      ids:
        description: Ідентифікатори наборів (кілька через |)
        required: false
      stage:
        description: Аналіз набору «стан розгляду справ», кількість днів
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - env:
          Q: ${{ inputs.q }}
          U: ${{ inputs.url }}
          I: ${{ inputs.ids }}
          DUMP: '1'
          S: ${{ inputs.stage }}
        run: |
          if [ -n "$S" ]; then node --max-old-space-size=6000 scripts/probe-stage.mjs "$S"; else node scripts/probe.mjs "$Q" "$U" "$I"; fi
