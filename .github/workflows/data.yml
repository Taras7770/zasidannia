name: Дані та сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 22 * * *'
    - cron: '40 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.data.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Перевірка коду
        run: |
          node scripts/build-data.mjs --src=test/sample.csv --out=/tmp/zdata --today=2026-11-11 --min=1 --stop=1000 --past=14
          node scripts/build-decisions.mjs --zip=test/edrsr_sample.zip --out=/tmp/zdata --today=2026-11-11 --min=1 --days=90 --files=7
          node test/run.mjs /tmp/zdata
      - name: Побудова даних з data.gov.ua
        id: data
        run: |
          node --max-old-space-size=6000 scripts/build-data.mjs --out=web/data
          du -sh web/data 2>/dev/null || true
      - name: Побудова даних про судові рішення (ЄДРСР)
        continue-on-error: true
        run: |
          node --max-old-space-size=6000 scripts/build-decisions.mjs --out=web/data
          du -sh web/data/d 2>/dev/null || true
      - name: Самоперевірка пошуку на реальних даних
        if: steps.data.outputs.changed != 'false'
        run: node scripts/selfcheck.mjs web/data 200
      - name: Залишити розклад увімкненим
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable" || true
      - uses: actions/configure-pages@v5
        if: steps.data.outputs.changed != 'false'
      - uses: actions/upload-pages-artifact@v4
        if: steps.data.outputs.changed != 'false'
        with:
          path: web

  deploy:
    needs: build
    if: needs.build.outputs.changed != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
